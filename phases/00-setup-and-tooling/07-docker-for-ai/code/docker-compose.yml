services:
  ai-dev:
    build:
      context: ./ai-dev
      dockerfile: Dockerfile
    volumes:
      - ./:/workspace
      - ~/models:/models
      - ~/datasets:/data
    ports:
      - "8888:8888"
    networks:
      - ai-qdrant
    stdin_open: true
    tty: true
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root

  flask:
    build:
      context: ./flask
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    networks:
      - flask-qdrant
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-qdrant
      - flask-qdrant

volumes:
  qdrant_data:

networks:
  ai-qdrant:
  flask-qdrant:

